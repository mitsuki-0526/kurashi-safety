<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>くらしの安全探検｜接続テスト</title>
<style>body{margin:0;background:#f4f6f2;color:#193e38;font:18px/1.7 system-ui,sans-serif}main{max-width:720px;margin:5vh auto;padding:24px}h1{font-size:28px}section{background:white;padding:24px;border-radius:16px;margin:20px 0}button{font:inherit;padding:12px 20px;border:0;border-radius:8px;background:#22685d;color:white;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.5;cursor:default}input{box-sizing:border-box;width:100%;padding:12px;font:inherit}#status{white-space:pre-wrap}li{margin:8px 0}small{display:block} [hidden]{display:none!important}</style></head>
<body><main><h1>接続テスト</h1><p>名前や回答は入力しません。「テスト」という文字だけを送ります。</p><section><p id="status" role="status" aria-live="polite">準備しています…</p><button id="start" disabled>準備中</button><button id="stop" hidden>受信を停止</button></section><section id="share" hidden><h2>生徒端末で開くリンク</h2><input id="link" readonly aria-label="生徒用テストリンク"><button id="copy">リンクをコピー</button><small>リンクは24時間有効です。受信は10分で停止します。後日のテストでは新しいリンクを作ってください。</small><h2>届いたテスト</h2><p id="count">0件</p><ul id="results"></ul></section><p>これは接続確認専用です。ゲームの回収先はまだ切り替わりません。</p></main><script type="module" src="./check.js"></script></body></html>
